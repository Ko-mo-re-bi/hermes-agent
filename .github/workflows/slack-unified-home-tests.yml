name: Slack Unified Home Acceptance
on:
  pull_request:
    paths:
      - 'plugins/platforms/slack/business_approval*.py'
      - 'plugins/platforms/slack/coordination_home.py'
      - 'tests/gateway/test_slack_business_approval_inbox.py'
      - '.github/workflows/slack-unified-home-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-home:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned test environment
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
      - name: Canonical targeted regression
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          bash scripts/run_tests.sh \
            tests/gateway/test_slack_business_approval_inbox.py \
            tests/gateway/test_slack_business_approval.py \
            tests/gateway/test_slack_business_approval_receiver.py \
            tests/gateway/test_slack_coordination_home.py \
            tests/gateway/test_slack_coordination_home_revision.py \
            tests/gateway/test_slack_home_worker_ownership.py \
            tests/gateway/test_slack_approval_buttons.py \
            tests/gateway/test_slack_plugin_action_handlers.py
